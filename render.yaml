services:
  - type: web
    name: famfin-unified-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB
        value: family_finance
      - key: REGION
        value: render
